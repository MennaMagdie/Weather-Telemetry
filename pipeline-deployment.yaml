---
# base station + its service:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-station
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-station
  template:
    metadata:
      labels:
        app: central-station
    spec:
      containers:
        - name: central-station
          image: central-station:latest
          imagePullPolicy: Never
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
          env:
            - name: KAFKA_SERVERS
              value: "kafka-service:9092"
            - name: ELASTICSEARCH_HOST
              value: "elasticsearch-service:9200"
            - name: BITCASK_DATA_DIR
              value: "/data/bitcask-data"
          volumeMounts:
            - name: shared-storage
              mountPath: /data
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-storage
---
# srvc for base station
apiVersion: v1
kind: Service
metadata:
  name: central-station-service
  namespace: pipeline
spec:
  selector:
    app: central-station
  ports:
    - port: 8080
      targetPort: 8080
---
# ElasticSearch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.10.4
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "2Gi"
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: pipeline
spec:
  selector:
    app: elasticsearch
  ports:
    - name: elasticsearch
      port: 9200
      targetPort: 9200
---
# Kibana
apiVersion: apps/v1
kind: Deployment
metadata:
