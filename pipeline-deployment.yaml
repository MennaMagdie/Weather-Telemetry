apiVersion: v1
kind: Namespace #namespace for project deployment
metadata:
  name: pipeline
---
# kafka service:
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: pipeline
spec: # what the deployment does:
  replicas: 1 
  selector: 
    matchLabels:
      app: kafka  # any pod that has label of kafka will be managed by this deployment (kafka srvc)
  template:
    metadata:
      labels:
        app: kafka
    spec: # specs for WHAT THE POD will be like:
      containers:
        - name: kafka
          image: apache/kafka:latest
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1Gi"
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-service:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_DIRS
              value: "/var/kafka-logs"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
          volumeMounts:
            - name: kafka-storage
              mountPath: /var/kafka-logs
      volumes:
        - name: kafka-storage
          persistentVolumeClaim:
            claimName: kafka-storage
---              
# kafka service [the docker files or img]
apiVersion: v1

kind: Service
metadata:
  name: kafka-service
  namespace: pipeline
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
